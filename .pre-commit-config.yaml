# Hook trước khi commit. Cài một lần: cd backend && python -m uv run pre-commit install
# Hiện chỉ kiểm tra backend/ (frontend có lint riêng) + quét lộ bí mật toàn repo.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        files: ^backend/
      - id: trailing-whitespace
        files: ^backend/
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: django-migrations-check
        name: Thiếu migration
        entry: bash -c 'cd backend && python -m uv run python manage.py makemigrations --check --dry-run'
        language: system
        files: ^backend/apps/.*/models
        pass_filenames: false
