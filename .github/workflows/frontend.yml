# CI cho web Next.js (frontend/). Chạy khi có thay đổi trong frontend/, openapi.yaml hoặc file này.
name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/openapi.yaml", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/openapi.yaml", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài thư viện (đúng package-lock)
        run: npm ci --no-audit --no-fund

      - name: Kiểu dữ liệu API khớp backend/openapi.yaml
        run: |
          npm run cms:types
          git diff --exit-code -- src/lib/cms/schema.d.ts

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Format
        run: npx prettier --check src messages

      # Không có CMS: trang dựng bằng dữ liệu mock, chỉ để chắc build được
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Lỗ hổng thư viện (bản chạy production)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (không push)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: bfc-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
