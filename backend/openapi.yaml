openapi: 3.0.3
info:
  title: BFC CMS API
  version: 1.0.0
  description: API nội bộ cho landing page BFC (Next.js gọi phía server).
paths:
  /api/v1/catalog/materials:
    get:
      operationId: catalog_materials_list
      description: 'Chất liệu theo thứ tự trong CMS (trang Vật liệu). Không phân trang:
        ít mục.'
      parameters:
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - vi
        description: Ngôn ngữ nội dung, mặc định tiếng Việt
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
          description: ''
  /api/v1/catalog/materials/{slug}:
    get:
      operationId: catalog_materials_retrieve
      parameters:
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - vi
        description: Ngôn ngữ nội dung, mặc định tiếng Việt
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
          description: ''
  /api/v1/catalog/menu:
    get:
      operationId: catalog_menu
      description: 'Menu con của header: Sản phẩm (nhóm → loại) và Vật liệu (nhóm
        menu → mục con).'
      parameters:
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - vi
        description: Ngôn ngữ nội dung, mặc định tiếng Việt
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
          description: ''
  /api/v1/catalog/products:
    get:
      operationId: catalog_products_list
      description: |-
        Sản phẩm đang xuất bản.

        Lọc nhiều chất liệu / tính năng: lặp tham số (?material=a&material=b), sản phẩm phải có đủ.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Slug nhóm
      - in: query
        name: feature
        schema:
          type: array
          items:
            type: string
        description: Slug tính năng, lặp được
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - vi
        description: Ngôn ngữ nội dung, mặc định tiếng Việt
      - in: query
        name: material
        schema:
          type: array
          items:
            type: string
        description: Slug chất liệu, lặp được
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
        description: Slug loại
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/v1/catalog/products/{slug}:
    get:
      operationId: catalog_products_retrieve
      parameters:
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - vi
        description: Ngôn ngữ nội dung, mặc định tiếng Việt
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/taxonomy:
    get:
      operationId: catalog_taxonomy
      description: Nhóm (kèm loại), chất liệu, tính năng với tên theo ngôn ngữ.
      parameters:
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - vi
        description: Ngôn ngữ nội dung, mặc định tiếng Việt
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'
          description: ''
  /api/v1/inquiries:
    post:
      operationId: inquiries_create
      parameters:
      - in: header
        name: X-BFC-Signature
        schema:
          type: string
        required: true
      - in: header
        name: X-BFC-Timestamp
        schema:
          type: string
        required: true
      tags:
      - inquiries
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryCreated'
          description: ''
        '429':
          description: No response body
  /api/v1/meta:
    get:
      operationId: meta_retrieve
      description: 'Thông tin chung cho frontend: các ngôn ngữ nội dung đang bật.'
      tags:
      - meta
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
          description: ''
  /api/v1/pages/{key}:
    get:
      operationId: pages_retrieve
      description: |-
        Trang theo khoá (home...).

        Chưa có bản dịch đã xuất bản thì trả bản gốc, is_fallback = true.
      parameters:
      - in: path
        name: key
        schema:
          type: string
          enum:
          - home
          - privacy
          - terms
        required: true
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - vi
        description: Ngôn ngữ nội dung, mặc định tiếng Việt
      tags:
      - pages
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPage'
          description: ''
  /api/v1/pages/preview/{token}:
    get:
      operationId: pages_preview_retrieve
      description: Bản nháp cho draft mode của frontend (docs/adr/0014). Chỉ nhận
        request đã ký.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - pages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
          description: ''
  /api/v1/site:
    get:
      operationId: site_retrieve
      description: Chữ song ngữ theo cột `_en`, không qua bảng Locale của Wagtail
        (docs/adr/0011).
      parameters:
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - vi
        description: Ngôn ngữ nội dung, mặc định tiếng Việt
      tags:
      - site
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
