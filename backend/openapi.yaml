    Company:
      type: object
      properties:
        name:
          type: string
        tagline:
          type: string
          readOnly: true
        legal_name:
          type: string
          readOnly: true
        tax_code:
          type: string
        address:
          type: string
          readOnly: true
      required:
      - address
      - legal_name
      - name
      - tagline
      - tax_code
    Contact:
      type: object
      properties:
        phone:
          type: string
        phone_href:
          type: string
          description: tel:+84...; rỗng nếu chưa có số
        email:
          type: string
        whatsapp_url:
          type: string
        zalo_url:
          type: string
        hours:
          type: string
          readOnly: true
        maps_url:
          type: string
        maps_embed_url:
          type: string
      required:
      - email
      - hours
      - maps_embed_url
      - maps_url
      - phone
      - phone_href
      - whatsapp_url
      - zalo_url
    ContentPage:
      type: object
      properties:
        title:
          type: string
        is_fallback:
          type: boolean
          readOnly: true
        updated_on:
          type: string
          format: date
          nullable: true
          readOnly: true
        seo:
          allOf:
          - $ref: '#/components/schemas/ContentPageSeo'
          readOnly: true
        body:
          type: array
          items:
            $ref: '#/components/schemas/PageBlock'
          readOnly: true
      required:
      - body
      - is_fallback
      - seo
      - title
      - updated_on
    ContentPageSeo:
      type: object
      description: Rỗng = frontend tự tạo từ nội dung, rồi tới SEO mặc định (docs/adr/0012).
      properties:
        title:
          type: string
        description:
          type: string
        noindex:
          type: boolean
        og_image:
          type: string
          nullable: true
      required:
      - description
      - noindex
      - og_image
      - title
    CtaPageBlock:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/CtaValue'
        type:
          $ref: '#/components/schemas/CtaPageBlockTypeEnum'
        id:
          type: string
      required:
      - id
      - type
      - value
    CtaPageBlockTypeEnum:
      enum:
      - cta
      type: string
      description: '* `cta` - cta'
    CtaValue:
      type: object
      properties:
        kicker:
          type: string
        title:
          type: string
        image:
          allOf:
          - $ref: '#/components/schemas/ImageData'
          nullable: true
        quote_label:
          type: string
        visit_label:
          type: string
      required:
      - image
      - kicker
      - quote_label
      - title
      - visit_label
