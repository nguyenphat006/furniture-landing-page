      properties:
        dimensions:
          type: object
          properties:
            length:
              type: number
            width:
              type: number
            height:
              type: number
            diameter:
              type: number
          description: cm; trường nào trống thì không có
          nullable: true
          readOnly: true
        assembly:
          allOf:
          - $ref: '#/components/schemas/AssemblyEnum'
          nullable: true
          readOnly: true
        pcs_per_box:
          type: integer
          nullable: true
        carton:
          type: object
          properties:
            length:
              type: number
            width:
              type: number
            height:
              type: number
            diameter:
              type: number
          description: cm; trường nào trống thì không có
          nullable: true
          readOnly: true
        loading:
          type: object
          properties:
            20GP:
              type: integer
            40GP:
              type: integer
            40HC:
              type: integer
          description: Số pcs mỗi container; loại nào trống thì không có
          nullable: true
          readOnly: true
        materials:
          type: array
          items:
            type: string
          readOnly: true
        features:
          type: array
          items:
            type: string
          readOnly: true
        type:
          type: string
        qty:
          type: integer
        image:
          allOf:
          - $ref: '#/components/schemas/Image'
          nullable: true
          readOnly: true
      required:
      - assembly
      - carton
      - dimensions
      - features
      - image
      - loading
      - materials
      - pcs_per_box
      - qty
      - type
    SideEnum:
      enum:
      - C
      - L
      - R
      type: string
      description: |-
        * `C` - C
        * `L` - L
        * `R` - R
    Site:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/Company'
        contact:
          $ref: '#/components/schemas/Contact'
        social:
          type: array
          items:
            $ref: '#/components/schemas/SocialLink'
        branding:
          $ref: '#/components/schemas/Branding'
        nav:
          type: array
          items:
            $ref: '#/components/schemas/NavItem'
          description: Mục menu chính đang hiện, theo thứ tự
        footer:
          $ref: '#/components/schemas/Footer'
        seo:
          $ref: '#/components/schemas/Seo'
        analytics:
          $ref: '#/components/schemas/Analytics'
        floating:
          type: array
          items:
            $ref: '#/components/schemas/FloatingAction'
          readOnly: true
          description: Cụm nút nổi sát mép phải, theo thứ tự; chỉ nút đang hiện và
            có link
      required:
      - analytics
      - branding
      - company
      - contact
      - floating
      - footer
      - nav
      - seo
      - social
    SocialLink:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/NetworkEnum'
        url:
          type: string
      required:
      - network
      - url
    TargetEnum:
      enum:
      - capabilities
      - materials
      - products
      - about
      - projects
      - contact
      - link
      type: string
      description: |-
        * `capabilities` - Năng lực
        * `materials` - Vật liệu (có menu con)
        * `products` - Sản phẩm (có menu con)
        * `about` - Về chúng tôi
        * `projects` - Dự án
        * `contact` - Liên hệ
        * `link` - Link khác
    Taxonomy:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Labelled'
        features:
          type: array
          items:
            $ref: '#/components/schemas/Labelled'
      required:
      - categories
      - features
      - materials
